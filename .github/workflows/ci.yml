name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superagent
          POSTGRES_PASSWORD: superagent
          POSTGRES_DB: superagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://superagent:superagent@localhost:5432/superagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @superagent/shared
      - run: npm run typecheck
      - name: Compile Bicep for RBAC policy tests
        run: az bicep build --file infra/main.bicep --outfile infra/main.json
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @superagent/shared
      - run: npx playwright install --with-deps chromium
      - name: Real-browser replay tests (egress blocking, read-back, digest check)
        run: npx vitest run test/browser.e2e.test.ts
        working-directory: apps/server
        env:
          RUN_BROWSER_TESTS: '1'

  e2e:
    # T-47: Playwright Test against the real app (all modules + built web) with a stub model provider.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @superagent/shared && npm run build -w @superagent/web
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
        working-directory: apps/e2e
        env:
          CI: '1'
      - name: Assertion map is complete (every prototype assertion has a status)
        run: node apps/e2e/check-assertion-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: apps/e2e/playwright-report
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t superagent:ci .
      - name: Build browser image (no push)
        run: docker build -f Dockerfile.browser -t superagent-browser:ci .
      - name: Run the sandbox container once (same entrypoint the Container Apps Job uses)
        run: |
          (cd ci && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          SPEC=$(node ci/make-run-spec.mjs http://127.0.0.1:8099/fixture.html)
          docker run --rm --network host -e APP_ROLE=browser -e RUN_SPEC="$SPEC" superagent-browser:ci | tee sandbox-run.log
          grep -q '"msg":"run_result"' sandbox-run.log
          grep -q '"ok":true' sandbox-run.log
          grep -q 'tracker.invalid' sandbox-run.log
          echo "--- guard: refuses main-app settings ---"
          if docker run --rm -e APP_ROLE=browser -e KEY_VAULT_URL=https://kv.example -e RUN_SPEC="$SPEC" superagent-browser:ci; then echo "should have refused"; exit 1; fi
      - name: Smoke test web role
        run: |
          docker run -d --name sa -p 8080:8080 -e APP_ROLE=web superagent:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 1; done
          docker logs sa; exit 1
