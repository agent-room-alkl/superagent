name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superagent
          POSTGRES_PASSWORD: superagent
          POSTGRES_DB: superagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://superagent:superagent@localhost:5432/superagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @superagent/shared
      - run: npm run typecheck
      - name: Compile Bicep for RBAC policy tests
        run: az bicep build --file infra/main.bicep --outfile infra/main.json
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @superagent/shared
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w @superagent/web
      - name: Real-browser replay tests (egress blocking, read-back, digest check)
        run: npx vitest run test/browser.e2e.test.ts test/knowledge.e2e.test.ts
        working-directory: apps/server
        env:
          RUN_BROWSER_TESTS: '1'

  image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t superagent:ci .
      - name: Build browser image (no push)
        run: docker build -f Dockerfile.browser -t superagent-browser:ci .
      - name: Run the sandbox container once (same entrypoint the Container Apps Job uses)
        run: |
          (cd ci && python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          SPEC=$(node ci/make-run-spec.mjs http://127.0.0.1:8099/fixture.html)
          docker run --rm --network host -e APP_ROLE=browser -e RUN_SPEC="$SPEC" superagent-browser:ci | tee sandbox-run.log
          grep -q '"msg":"run_result"' sandbox-run.log
          grep -q '"ok":true' sandbox-run.log
          grep -q 'tracker.invalid' sandbox-run.log
          echo "--- guard: refuses main-app settings ---"
          if docker run --rm -e APP_ROLE=browser -e KEY_VAULT_URL=https://kv.example -e RUN_SPEC="$SPEC" superagent-browser:ci; then echo "should have refused"; exit 1; fi
      - name: Web and worker roles fail closed without production settings
        run: |
          set +e
          docker run --rm -e APP_ROLE=web superagent:ci > refuse.log 2>&1; code=$?
          cat refuse.log
          test $code -ne 0 || { echo "should have refused to start"; exit 1; }
          grep -q 'ENTRA_TENANT_ID' refuse.log && grep -q 'KEY_VAULT_URL' refuse.log && grep -q 'PLATFORM_TENANT_ID' refuse.log || { echo 'refusal must name the missing settings'; exit 1; }
          docker run --rm -e APP_ROLE=worker superagent:ci > worker.log 2>&1; code=$?
          cat worker.log
          test $code -ne 0 && grep -q 'PLATFORM_TENANT_ID' worker.log || { echo 'worker must refuse to start without production settings'; exit 1; }
          docker run --rm -e APP_ROLE=web -e AUTH_MODE=dev superagent:ci > dev.log 2>&1; code=$?
          test $code -ne 0 && grep -q 'AUTH_MODE=dev is not allowed in production' dev.log || { cat dev.log; echo "dev auth must be refused in production"; exit 1; }
      - name: Smoke test web role (production wiring, unreachable dependencies)
        run: |
          # Placeholder hosts only: nothing here is a credential. The pool and Key Vault client connect lazily.
          docker run -d --name sa -p 8080:8080 -e APP_ROLE=web \
            -e ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000001 -e ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000002 \
            -e PLATFORM_TENANT_ID=00000000-0000-0000-0000-000000000003 -e KEY_VAULT_URL=https://kv.invalid/ \
            -e DATABASE_URL=postgres://app@pg.invalid:5432/superagent -e BLOB_URL=https://blob.invalid/ -e DOC_INTEL_ENDPOINT=https://ci-placeholder.cognitiveservices.azure.com/ superagent:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz || { docker logs sa; exit 1; }
          test "$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' http://localhost:8080/readyz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-dev-user: u|owner|' http://localhost:8080/api/v1/setup/llm)" = 401
          echo "healthz 200, readyz 503 (postgres unreachable), dev header rejected with 401"
